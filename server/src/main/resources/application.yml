server:
  port: 8080

spring:
  application:
    name: guyi-craft-server
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/*.xml

guyi:
  upload:
    path: ../upload
  wx:
    app-id: wx66543184e2b44625
    secret: cd075d3a693ce086c566db430d9fa079
  jwt:
    secret: change-me-to-a-random-secret-key-at-least-32-bytes
    expire-seconds: 604800
